# JVM settings for the Gradle daemon
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError

# AndroidX (required; Jetifier not needed — no legacy support libraries)
android.useAndroidX=true

# Build performance
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# Only build resources for the default locale set; expand when translations arrive
android.nonTransitiveRClass=true
